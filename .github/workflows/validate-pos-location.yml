name: Validate POS Location Bridge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pos-location:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, sqlite3, pdo_sqlite
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force || true
      - name: Syntax check
        run: |
          php -l app/Services/PosLocationStockBridge.php
          php -l app/Services/PosLocationSaleStockService.php
          php -l app/Services/PosOperationalContextService.php
          php -l app/Services/UserOperationalAssignmentService.php
          php -l app/Services/LocationAwareBatchService.php
          php -l app/Services/LocationAwareSerialNumberService.php
          php -l app/Http/Controllers/PosLocationInventoryController.php
          php -l app/Http/Controllers/PosLocationCatalogController.php
          php -l app/Http/Controllers/PosCashRegisterController.php
          php -l app/Http/Controllers/PosCashRegisterReportController.php
          php -l app/Http/Controllers/Organization/UserAccessController.php
          php -l app/Http/Controllers/Organization/UserAccessEditController.php
          php -l app/Http/Controllers/Organization/EmployeeAccessController.php
          php -l app/Models/product_warehouse.php
          php -l app/Models/Sale.php
          php -l app/Models/CashRegister.php
          php -l app/Providers/AppServiceProvider.php
          php -l app/Providers/RouteServiceProvider.php
          php -l routes/tenant_pos_location.php
          php -l routes/tenant_pos_register.php
          php -l routes/tenant_pos_reports.php
          php -l database/migrations/tenant/2026_08_25_181500_add_native_location_context_to_cash_registers.php
          php -l database/migrations/tenant/2026_08_26_091500_make_cash_register_warehouse_nullable.php
          php -l tests/Unit/PosLocationStockBridgeTest.php
          php -l tests/Unit/PosLocationSaleStockServiceTest.php
          php -l tests/Unit/PosNativeCashRegisterArchitectureTest.php
          php -l tests/Unit/PosNativeCashRegisterReportArchitectureTest.php
          php -l tests/Unit/PosCashDrawerAssignmentArchitectureTest.php
          php -l tests/Unit/PosCashRegisterWarehouseNullableArchitectureTest.php
          php -l tests/Unit/PosNativeCatalogGateArchitectureTest.php
          node --check resources/src/utils/posOperationalLocationBridge.js
          node --check resources/static/prodex-pos-location-ui.js
          node --check resources/static/prodex-pos-location-catalog.js
          node --check resources/static/prodex-pos-optional-cash-drawer.js
      - name: Run focused bridge tests
        run: vendor/bin/phpunit tests/Unit/PosLocationStockBridgeTest.php tests/Unit/PosLocationSaleStockServiceTest.php tests/Unit/PosNativeCashRegisterArchitectureTest.php tests/Unit/PosNativeCashRegisterReportArchitectureTest.php tests/Unit/PosCashDrawerAssignmentArchitectureTest.php tests/Unit/PosCashRegisterWarehouseNullableArchitectureTest.php tests/Unit/PosNativeCatalogGateArchitectureTest.php
