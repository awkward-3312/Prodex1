name: Validate Transfer Location Inventory

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  transfer-location:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force || true

      - name: PHP and JavaScript syntax checks
        run: |
          php -l app/Models/Transfer.php
          php -l app/Models/TransferDetailSerial.php
          php -l app/Http/Middleware/LockTransferDispatchStock.php
          php -l app/Services/TransferLocationDispatchService.php
          php -l app/Services/TransferSerialLocationService.php
          php -l app/Services/TransferBatchIssueService.php
          php -l app/Services/LocationAwareTransferLogisticsService.php
          php -l app/Services/FinalTransferLogisticsService.php
          php -l app/Services/TransferIssueLocationResolutionService.php
          php -l app/Services/TransferLocationStockBridge.php
          php -l app/Http/Controllers/TransferDiscrepancyController.php
          php -l app/Http/Controllers/TransferLocationController.php
          php -l app/Http/Controllers/FinalTransferLogisticsController.php
          php -l app/Http/Controllers/LocationAwareTransferDiscrepancyController.php
          php -l app/Http/Controllers/FinalTransferDiscrepancyController.php
          php -l app/Providers/AppServiceProvider.php
          php -l app/Console/Commands/ProdexTenantUpgrade.php
          php -l routes/tenant_transfer_logistics.php
          php -l routes/tenant_transfer_locations.php
          php -l database/migrations/tenant/2026_08_21_185000_add_inventory_locations_to_transfers.php
          php -l database/migrations/tenant/2026_08_21_186000_create_transfer_detail_serials.php
          php -l database/migrations/tenant/2026_08_21_187000_create_transfer_batch_issue_allocations.php
          php -l tests/Unit/TransferSerialLocationServiceTest.php
          php -l tests/Unit/TransferBatchIssueServiceTest.php
          php -l tests/Unit/TransferLocationAccessControllerTest.php
          php -l tests/Unit/TransferDiscrepancyLocationAccessTest.php
          php -l tests/Unit/TransferDispatchPreflightTest.php
          node --check resources/static/prodex-transfer-location-ui.js
          node --check resources/static/prodex-transfer-logistics.js

      - name: Run focused transfer tests
        run: |
          vendor/bin/phpunit tests/Unit/TransferSerialLocationServiceTest.php
          vendor/bin/phpunit tests/Unit/TransferBatchIssueServiceTest.php
          vendor/bin/phpunit tests/Unit/TransferLocationAccessControllerTest.php
          vendor/bin/phpunit tests/Unit/TransferDiscrepancyLocationAccessTest.php
          vendor/bin/phpunit tests/Unit/TransferLogisticsServiceTest.php tests/Unit/TransferLogisticsBatchUnitsTest.php tests/Unit/TransferDispatchPreflightTest.php

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Production frontend build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run production
