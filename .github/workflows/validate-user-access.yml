name: Validate User Access

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  user-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, sqlite3, pdo_sqlite, gd, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force || true
      - name: Syntax check
        run: |
          php -l app/Http/Controllers/Organization/UserAccessController.php
          php -l app/Console/Commands/ProdexTenantUpgrade.php
          php -l database/migrations/tenant/2026_08_22_230000_make_users_phone_nullable.php
          php -l tests/Unit/UserPhoneNullableMigrationTest.php
      - name: Optional phone regression test
        run: vendor/bin/phpunit tests/Unit/UserPhoneNullableMigrationTest.php
