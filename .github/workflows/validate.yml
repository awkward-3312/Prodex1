name: Validate PRODEX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, sqlite3, pdo_sqlite, gd, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force || true
      - name: Run focused SAR tests
        run: vendor/bin/phpunit tests/Unit/SarFiscalNumberServiceTest.php tests/Unit/TenantTaxConfigResolverTest.php tests/Unit/SarInvoiceSettingsTest.php
      - name: Run transfer logistics integrity tests
        run: vendor/bin/phpunit tests/Unit/TransferLogisticsServiceTest.php tests/Unit/TransferLogisticsBatchUnitsTest.php tests/Unit/TransferDispatchPreflightTest.php
      - name: Run organization scope tests
        run: vendor/bin/phpunit tests/Unit/WarehouseScopeServiceTest.php tests/Unit/BranchInventoryScopeServiceTest.php
      - name: Run inventory architecture tests
        run: vendor/bin/phpunit tests/Unit/InventoryLocationServiceTest.php tests/Unit/InventoryServiceTest.php tests/Unit/LegacyInventoryReconciliationServiceTest.php tests/Unit/InventoryCompatibilityServiceTest.php tests/Unit/InventoryReadServiceTest.php
      - name: PHP syntax check for SAR files
        run: |
          php -l app/Services/SarFiscalNumberService.php
          php -l app/Services/SarFiscalSaleService.php
          php -l app/Services/SarInvoiceSettings.php
          php -l app/Http/Controllers/SarFiscalSettingsController.php
          php -l app/Http/Controllers/SarDirectNetworkPrintController.php
          php -l app/Models/SarFiscalProfile.php
          php -l database/migrations/tenant/2026_08_19_220000_backfill_honduras_product_fiscal_tax.php
      - name: PHP syntax check for attendance integration files
        run: |
          php -l app/Http/Controllers/hrm/AttendancesController.php
          php -l app/Http/Controllers/hrm/AttendanceIntegrationsController.php
          php -l app/Models/Attendance.php
          php -l app/Models/AttendanceDevice.php
          php -l app/Models/AttendanceEmployeeIdentifier.php
          php -l app/Models/AttendancePunch.php
          php -l app/Models/Employee.php
          php -l app/Providers/RouteServiceProvider.php
          php -l app/Services/TenantSchemaHealthService.php
          php -l routes/tenant_attendance_integrations.php
          php -l database/migrations/tenant/2026_08_20_220000_create_attendance_devices_table.php
          php -l database/migrations/tenant/2026_08_20_220100_create_attendance_employee_identifiers_table.php
          php -l database/migrations/tenant/2026_08_20_220200_create_attendance_punches_table.php
          php -l database/migrations/tenant/2026_08_20_220300_add_source_to_attendances_table.php
      - name: PHP syntax check for transfer logistics files
        run: |
          php -l app/Http/Controllers/TransferLogisticsController.php
          php -l app/Http/Controllers/TransferDiscrepancyController.php
          php -l app/Http/Middleware/LockTransferDispatchStock.php
          php -l app/Http/Kernel.php
          php -l app/Services/TransferLogisticsService.php
          php -l app/Services/SafeTransferLogisticsService.php
          php -l app/Services/IdempotentTransferLogisticsService.php
          php -l app/Services/TransferDispatchGuardService.php
          php -l app/Models/Transfer.php
          php -l app/Models/TransferDetail.php
          php -l app/Models/TransferReceipt.php
          php -l app/Models/TransferReceiptItem.php
          php -l app/Providers/AppServiceProvider.php
          php -l routes/tenant_transfer_logistics.php
          php -l routes/tenant_transfer_logistics_web.php
          php -l database/migrations/tenant/2026_08_20_220000_add_transfer_logistics_receiving.php
          php -l database/migrations/tenant/2026_08_20_220100_add_transfer_receipt_batch_allocations.php
          php -l database/migrations/tenant/2026_08_20_220200_add_transfer_discrepancy_resolution_workflow.php
          php -l database/migrations/tenant/2026_08_20_220300_normalize_pending_transfer_logistics.php
          php -l database/migrations/tenant/2026_08_20_220400_add_transfer_receipt_idempotency.php
          php -l database/migrations/tenant/2026_08_20_220500_backfill_existing_transfer_logistics.php
          php -l tests/Unit/TransferLogisticsServiceTest.php
          php -l tests/Unit/TransferLogisticsBatchUnitsTest.php
          php -l tests/Unit/TransferDispatchPreflightTest.php
      - name: PHP syntax check for organization and user access files
        run: |
          php -l app/Services/WarehouseScopeService.php
          php -l app/Services/BranchScopeService.php
          php -l app/Services/InventoryLocationScopeService.php
          php -l app/Services/UserOperationalAssignmentService.php
          php -l app/Http/Middleware/EnforceWarehouseScope.php
          php -l app/Http/Controllers/Organization/BranchController.php
          php -l app/Http/Controllers/Organization/EmployeeAccessController.php
          php -l app/Http/Controllers/Organization/UserAccessController.php
          php -l app/Http/Controllers/Organization/RoleTemplateController.php
          php -l app/Http/Controllers/hrm/EmployeesController.php
          php -l app/Models/User.php
          php -l app/Models/UserOperationalAssignment.php
          php -l app/Models/CashDrawer.php
          php -l app/Providers/RouteServiceProvider.php
          php -l routes/tenant_organization.php
          php -l database/seeders/Central/ProdexManualsSeeder.php
          php -l database/migrations/tenant/2026_08_21_090000_add_organization_structure_foundation.php
          php -l database/migrations/tenant/2026_08_21_180000_add_branch_inventory_scope_to_users.php
          php -l tests/Unit/WarehouseScopeServiceTest.php
          php -l tests/Unit/BranchInventoryScopeServiceTest.php
      - name: PHP syntax check for inventory architecture
        run: |
          php -l app/Models/InventoryLocation.php
          php -l app/Models/InventoryLocationStock.php
          php -l app/Models/InventoryLocationMovement.php
          php -l app/Models/InventoryTransitionState.php
          php -l app/Models/Branch.php
          php -l app/Models/Warehouse.php
          php -l app/Services/InventoryLocationService.php
          php -l app/Services/InventoryService.php
          php -l app/Services/LegacyInventoryReconciliationService.php
          php -l app/Services/InventoryCompatibilityService.php
          php -l app/Services/InventoryReadService.php
          php -l app/Services/TenantSchemaHealthService.php
          php -l app/Console/Commands/ProdexInventoryReconcile.php
          php -l app/Console/Commands/ProdexInventoryTransition.php
          php -l database/migrations/tenant/2026_08_21_150000_create_inventory_locations_foundation.php
          php -l database/migrations/tenant/2026_08_21_160000_create_inventory_location_stock_engine.php
          php -l database/migrations/tenant/2026_08_21_170000_create_inventory_transition_states.php
          php -l tests/Unit/InventoryLocationServiceTest.php
          php -l tests/Unit/InventoryServiceTest.php
          php -l tests/Unit/LegacyInventoryReconciliationServiceTest.php
          php -l tests/Unit/InventoryCompatibilityServiceTest.php
          php -l tests/Unit/InventoryReadServiceTest.php

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check standalone transfer and organization scripts
        run: |
          node --check resources/static/prodex-transfer-idempotency.js
          node --check resources/static/prodex-transfer-logistics.js
          node --check resources/static/prodex-transfer-permission-ui.js
          node --check resources/static/prodex-transfer-issues.js
          node --check resources/static/prodex-organization-navigation.js
      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run production
