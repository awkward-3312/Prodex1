name: Validate PRODEX

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, sqlite3, pdo_sqlite, gd, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force || true
      - name: Run focused SAR tests
        run: vendor/bin/phpunit tests/Unit/SarFiscalNumberServiceTest.php tests/Unit/TenantTaxConfigResolverTest.php tests/Unit/SarInvoiceSettingsTest.php
      - name: Run transfer logistics integrity tests
        run: vendor/bin/phpunit tests/Unit/TransferLogisticsServiceTest.php
      - name: PHP syntax check for SAR files
        run: |
          php -l app/Services/SarFiscalNumberService.php
          php -l app/Services/SarFiscalSaleService.php
          php -l app/Services/SarInvoiceSettings.php
          php -l app/Http/Controllers/SarFiscalSettingsController.php
          php -l app/Http/Controllers/SarDirectNetworkPrintController.php
          php -l app/Models/SarFiscalProfile.php
          php -l database/migrations/tenant/2026_08_19_220000_backfill_honduras_product_fiscal_tax.php
      - name: PHP syntax check for attendance integration files
        run: |
          php -l app/Http/Controllers/hrm/AttendancesController.php
          php -l app/Http/Controllers/hrm/AttendanceIntegrationsController.php
          php -l app/Models/Attendance.php
          php -l app/Models/AttendanceDevice.php
          php -l app/Models/AttendanceEmployeeIdentifier.php
          php -l app/Models/AttendancePunch.php
          php -l app/Models/Employee.php
          php -l app/Providers/RouteServiceProvider.php
          php -l app/Services/TenantSchemaHealthService.php
          php -l routes/tenant_attendance_integrations.php
          php -l database/migrations/tenant/2026_08_20_220000_create_attendance_devices_table.php
          php -l database/migrations/tenant/2026_08_20_220100_create_attendance_employee_identifiers_table.php
          php -l database/migrations/tenant/2026_08_20_220200_create_attendance_punches_table.php
          php -l database/migrations/tenant/2026_08_20_220300_add_source_to_attendances_table.php
      - name: PHP syntax check for transfer logistics files
        run: |
          php -l app/Http/Controllers/TransferLogisticsController.php
          php -l app/Http/Controllers/TransferDiscrepancyController.php
          php -l app/Services/TransferLogisticsService.php
          php -l app/Models/Transfer.php
          php -l app/Models/TransferReceipt.php
          php -l app/Models/TransferReceiptItem.php
          php -l routes/tenant_transfer_logistics.php
          php -l routes/tenant_transfer_logistics_web.php
          php -l database/migrations/tenant/2026_08_20_220000_add_transfer_logistics_receiving.php
          php -l database/migrations/tenant/2026_08_20_220100_add_transfer_receipt_batch_allocations.php
          php -l database/migrations/tenant/2026_08_20_220200_add_transfer_discrepancy_resolution_workflow.php
          php -l tests/Unit/TransferLogisticsServiceTest.php

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check standalone transfer scripts
        run: |
          node --check resources/static/prodex-transfer-logistics.js
          node --check resources/static/prodex-transfer-permission-ui.js
          node --check resources/static/prodex-transfer-issues.js
      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run production
