          php -l app/Http/Controllers/DamageController.php
          php -l database/migrations/tenant/2026_08_31_000000_add_inventory_location_to_adjustments_and_damages.php
          php -l app/Services/BatchLocationService.php
          php -l app/Services/SerialLocationService.php
          php -l app/Services/InternalInventoryMoveService.php
          php -l app/Services/TenantSchemaHealthService.php
          php -l app/Http/Controllers/ProductsController.php
          php -l app/Console/Commands/ProdexInventoryReconcile.php
          php -l app/Console/Commands/ProdexInventoryTransition.php
          php -l database/migrations/tenant/2026_08_21_150000_create_inventory_locations_foundation.php
          php -l database/migrations/tenant/2026_08_21_160000_create_inventory_location_stock_engine.php
          php -l database/migrations/tenant/2026_08_21_170000_create_inventory_transition_states.php
          php -l database/migrations/tenant/2026_08_21_183000_add_location_tracking_to_batches_and_serials.php
          php -l database/migrations/tenant/2026_08_21_184000_create_batch_location_movement_ledger.php
          php -l tests/Unit/InventoryLocationServiceTest.php
          php -l tests/Unit/InventoryServiceTest.php
          php -l tests/Unit/LegacyInventoryReconciliationServiceTest.php
          php -l tests/Unit/InventoryCompatibilityServiceTest.php
          php -l tests/Unit/InventoryReadServiceTest.php
          php -l tests/Unit/BatchLocationServiceTest.php
          php -l tests/Unit/SerialLocationServiceTest.php
          php -l tests/Unit/InternalInventoryMoveServiceTest.php
      - name: PHP syntax check for public landing (landing-prime) files
        run: |
          php -l app/Services/PlanRecommendationService.php
          php -l app/Support/LandingContact.php
          php -l app/Http/Controllers/Central/PricingCalculatorController.php
          php -l app/Http/Controllers/Central/LandingPageController.php
          php -l app/Support/LandingPageTemplate.php
          php -l tests/Unit/PlanRecommendationServiceTest.php
          php -l tests/Unit/LandingPrimeContractTest.php

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Build runtime de PRODEX: se mantiene en Node 20 (webpack antiguo /
          # Laravel Mix). NO cambiar a Node 24 sin validar compatibilidad completa.
          # (El runtime interno de las actions sí es Node 24 desde checkout@v5 /
          # setup-node@v5 — eso es independiente de esta node-version.)
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check standalone transfer and organization scripts
        run: |
          node --check resources/static/prodex-transfer-idempotency.js
          node --check resources/static/prodex-transfer-logistics.js
          node --check resources/static/prodex-transfer-permission-ui.js
          node --check resources/static/prodex-transfer-issues.js
          node --check resources/static/prodex-organization-navigation.js
          node --check public/assets_super/js/landing-prime.js
      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run production
      # Fase C0 safety net: the px-next playground and every /app/_ui preview
      # must stay out of the production bundle (they live behind
      # `process.env.NODE_ENV !== "production"` in the router and should be
      # dead-code-eliminated). Fail the build if any marker leaks into public/js.
      - name: Assert playground / _ui previews are NOT in the production bundle
        run: |
          set -e
          markers='views/app/_ui|app/_ui/index|px-next-playground|px_next_playground|px-next-products|px_next_products_preview|px_next_dashboard_preview|px-next-dashboard-dev|ModuleMapSection|PxShellMock'
          if grep -REl "$markers" public/js/ ; then
            echo "::error::Playground / _ui preview code leaked into the production bundle (see files above)."
            exit 1
          fi
          echo "OK — no playground / _ui markers in public/js/"
      # Artifact SÓLO para inspección / descarga manual. NO dispara ningún deploy
      # automático: el antiguo job de despliegue de assets al VPS fue retirado y
      # el despliegue es ahora un procedimiento controlado aparte. Es opcional y
      # no afecta el estado del workflow más allá de subir el zip.
      - name: Upload built frontend assets (manual inspection only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: frontend-assets
          path: |
            public/js
            public/css
            public/mix-manifest.json
          if-no-files-found: error
          retention-days: 3
