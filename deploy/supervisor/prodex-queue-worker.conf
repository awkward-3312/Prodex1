; ---------------------------------------------------------------------------
; Configuración de Supervisor para las colas de PRODEX
; ---------------------------------------------------------------------------
;
; Procesa las colas de sincronización de WooCommerce y la cola predeterminada
; mediante un worker persistente.
;
; Antes de usarla en otro servidor, revisa las rutas y el usuario de ejecución.
; ---------------------------------------------------------------------------

[program:prodex-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/prodex/artisan queue:work database --queue=woocommerce-sync,woocommerce-stock,default --sleep=1 --tries=1 --timeout=1200 --max-time=3600
directory=/var/www/prodex
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=prodexadmin
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/prodex/storage/logs/queue-worker.log
stopwaitsecs=3600
