; ---------------------------------------------------------------------------
; Supervisor configuration for Stocky SaaS queue workers
; ---------------------------------------------------------------------------
;
; This processes the WooCommerce sync queues (and the default queue) with a
; persistent worker. It replaces the need for the shared-hosting cron fallback
; defined in app/Console/Kernel.php (queue:work ... every minute). Both can run
; at the same time without conflict, but a persistent worker is faster.
;
; FULL SETUP GUIDE (all three worker options): deploy/QUEUE_WORKER_SETUP.md
;
; WHY THIS IS NEEDED
;   WooCommerce product/stock syncs run in small batches. Each batch re-dispatches
;   the next batch onto a FIXED queue:
;       - products push/pull -> "woocommerce-sync"
;       - stock sync         -> "woocommerce-stock"
;   A worker MUST listen to these queues or the sync hangs at "queued_next_batch".
;
; INSTALL (Linux, as root)
;   1) Copy this file:
;        cp deploy/supervisor/stocky-queue-worker.conf /etc/supervisor/conf.d/
;   2) Edit the paths/user below to match your server:
;        - command path to `php` and to `artisan`
;        - directory   = your application root
;        - user        = the web/app user (e.g. www-data)
;        - stdout_logfile location must be writable
;   3) Reload Supervisor:
;        supervisorctl reread
;        supervisorctl update
;        supervisorctl start stocky-queue-worker:*
;
; NOTES
;   - Queue order matters: woocommerce-sync,woocommerce-stock are listed before
;     default so sync batches are not starved by other jobs.
;   - --max-time=3600 recycles each worker hourly to release memory; Supervisor
;     restarts it automatically (autorestart=true).
;   - --tries=1 matches the jobs (they manage their own batching/idempotency).
;   - Increase numprocs to run more sync batches in parallel (one batch per proc).
;   - --timeout should be >= your slowest single batch (media uploads can be slow).
; ---------------------------------------------------------------------------

[program:stocky-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/stocky/artisan queue:work database --queue=woocommerce-sync,woocommerce-stock,default --sleep=1 --tries=1 --timeout=1200 --max-time=3600
directory=/var/www/stocky
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/stocky/storage/logs/queue-worker.log
stopwaitsecs=3600
