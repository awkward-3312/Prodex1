# MySQL aislado para los E2E. NO toca ninguna base de datos de desarrollo ni de producción.
# Uso: E2E_DB_PASSWORD=... docker compose -f tests/e2e/docker-compose.yml up -d --wait
services:
  mysql:
    image: mysql:8.4
    container_name: prodex-e2e-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${E2E_DB_PASSWORD:?define E2E_DB_PASSWORD}
    ports:
      - "127.0.0.1:${E2E_DB_PORT:-3307}:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-log-bin"]
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
